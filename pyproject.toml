[project]
name = "data-cleaning-reporting-automation"
version = "0.1.0"
description = "AI-assisted data quality, analysis, reporting, and Power BI export."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "polars>=1.0", "openpyxl>=3.1", "XlsxWriter>=3.2",
  "duckdb>=1.0", "pyarrow>=16", "plotly>=5.22", "matplotlib>=3.9", "scikit-learn>=1.5",
  "pandera>=0.20", "fastapi>=0.112", "uvicorn[standard]>=0.30", "streamlit>=1.37",
  "typer>=0.12", "rich>=13.7", "pydantic>=2.8", "pydantic-settings>=2.4", "loguru>=0.7",
  "openai>=1.40", "reportlab>=4.2", "python-multipart>=0.0.9"
]

[project.optional-dependencies]
ai = ["langchain>=0.2", "langgraph>=0.2", "litellm>=1.44", "instructor>=1.3"]
quality = ["great-expectations>=0.18"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "black>=24.8", "pre-commit>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
